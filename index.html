<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sai Kandagattla | Data Analytics Portfolio</title>
  <meta name="description" content="Portfolio of Sai Kandagattla. Data analytics projects in Python, SQL, Tableau, Power BI and Excel." />

  <style>
    :root{
      --bg0:#070A12;
      --bg1:#0A0F1E;
      --glass:rgba(255,255,255,0.06);
      --glass2:rgba(255,255,255,0.09);
      --stroke:rgba(255,255,255,0.12);

      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.70);

      --accent:#59C1FF;
      --accent2:#7CFFB2;
      --accent3:#FFB86B;

      --shadow: 0 22px 70px rgba(0,0,0,0.40);
      --shadow2: 0 12px 35px rgba(0,0,0,0.30);

      --r1:16px;
      --r2:24px;
      --max:1120px;

      --ring: 0 0 0 3px rgba(255,255,255,0.25), 0 0 0 7px rgba(89,193,255,0.18);
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1200px 900px at 20% 20%, rgba(89,193,255,0.12), transparent 55%),
        radial-gradient(1000px 700px at 80% 30%, rgba(124,255,178,0.10), transparent 60%),
        radial-gradient(900px 700px at 55% 95%, rgba(255,184,107,0.08), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }

    /* Dynamic analytics background */
    #bg{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      pointer-events:none;
      opacity:0.95;
    }

    /* Soft vignette + subtle grain */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(255,255,255,0.06), transparent 55%),
        radial-gradient(1200px 900px at 50% 95%, rgba(0,0,0,0.55), transparent 60%),
        radial-gradient(900px 700px at 50% 50%, transparent 45%, rgba(0,0,0,0.42)),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.012), rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: overlay;
      opacity:0.9;
    }

    a{ color:inherit; text-decoration:none; }
    a:hover{ text-decoration:none; }
    a:focus-visible{
      outline:none;
      box-shadow:var(--ring);
      border-radius:12px;
    }

    .wrap{
      position:relative;
      z-index:1;
      max-width:var(--max);
      margin:0 auto;
      padding:28px 18px 72px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 12px;
      border:1px solid var(--stroke);
      background: rgba(10,15,30,0.55);
      border-radius:18px;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow2);
      position: sticky;
      top: 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 240px;
    }

    .avatar{
      width:44px;
      height:44px;
      border-radius:50%;
      object-fit:cover;
      border:1px solid rgba(89,193,255,0.35);
      box-shadow: 0 14px 34px rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.08);
    }

    .brand strong{ display:block; font-size:14px; letter-spacing:0.2px; }
    .brand span{ display:block; font-size:12px; color:var(--muted); margin-top:2px; }

    nav{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .navlink{
      font-size:13px;
      color:var(--muted);
      padding:9px 11px;
      border-radius:14px;
      border:1px solid transparent;
      background: rgba(255,255,255,0.04);
      transition: 160ms ease;
    }

    .navlink:hover{
      color:var(--text);
      border-color: rgba(89,193,255,0.24);
      background: rgba(89,193,255,0.10);
      transform: translateY(-1px);
    }

    .hero{
      margin-top:20px;
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap:16px;
      align-items:start;
    }

    .panel{
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.05));
      border-radius: var(--r2);
      box-shadow: var(--shadow);
      padding:22px;
      position:relative;
      overflow:hidden;
      backdrop-filter: blur(14px);
    }

    .panel::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(900px 340px at 12% 20%, rgba(89,193,255,0.16), transparent 55%),
        radial-gradient(800px 360px at 90% 30%, rgba(124,255,178,0.10), transparent 60%),
        radial-gradient(700px 320px at 35% 95%, rgba(255,184,107,0.08), transparent 62%);
      pointer-events:none;
      filter: blur(10px);
      opacity: 1;
    }
    .panel > *{ position:relative; }

    .kicker{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-size:12px;
      letter-spacing:0.7px;
      text-transform: uppercase;
      font-weight: 900;
      color: rgba(255,255,255,0.82);
    }

    .kdot{
      width:10px;
      height:10px;
      border-radius:999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(89,193,255,0.85));
      box-shadow: 0 0 0 7px rgba(89,193,255,0.16), 0 10px 25px rgba(0,0,0,0.35);
    }

    h1{
      margin: 12px 0 10px;
      font-size: 42px;
      line-height: 1.06;
      letter-spacing: -1.0px;
    }

    .sub{
      margin:0;
      max-width: 64ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .chips{
      margin-top:16px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .chip{
      font-size:12px;
      color: rgba(255,255,255,0.9);
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 0 10px 25px rgba(0,0,0,0.22);
    }

    .chip.accent{
      border-color: rgba(89,193,255,0.30);
      background: linear-gradient(135deg, rgba(89,193,255,0.18), rgba(124,255,178,0.10));
    }

    .cta{
      margin-top: 18px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:10px 14px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.94);
      font-weight: 900;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.22);
      transition: 160ms ease;
      cursor:pointer;
    }

    .btn:hover{
      background: rgba(255,255,255,0.08);
      border-color: rgba(89,193,255,0.26);
      transform: translateY(-1px);
    }

    .btn.primary{
      border-color: rgba(89,193,255,0.36);
      background: linear-gradient(135deg, rgba(89,193,255,0.18), rgba(124,255,178,0.10));
    }

    .btn.primary:hover{
      background: linear-gradient(135deg, rgba(89,193,255,0.24), rgba(124,255,178,0.14));
    }

    .right{
      display:grid;
      gap:16px;
    }

    .mini{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,0.05);
      border-radius: var(--r1);
      padding:16px;
      box-shadow: var(--shadow2);
      backdrop-filter: blur(14px);
      position:relative;
      overflow:hidden;
    }

    .mini::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(700px 260px at 20% 20%, rgba(89,193,255,0.12), transparent 60%),
        radial-gradient(700px 260px at 85% 30%, rgba(124,255,178,0.08), transparent 60%);
      pointer-events:none;
      filter: blur(12px);
      opacity:0.9;
    }
    .mini > *{ position:relative; }

    .mini h3{
      margin:0 0 10px;
      font-size:14px;
      letter-spacing:-0.2px;
    }
    .mini p{
      margin:0;
      color: var(--muted);
      font-size:13px;
      line-height:1.65;
    }

    .statRow{
      margin-top: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }

    .stat{
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 10px 10px;
    }
    .stat strong{ display:block; font-size: 13px; }
    .stat span{ display:block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .section{
      margin-top:18px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,0.05);
      border-radius: var(--r2);
      padding: 18px;
      box-shadow: var(--shadow2);
      backdrop-filter: blur(14px);
      position:relative;
      overflow:hidden;
    }

    .section::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(900px 260px at 15% 20%, rgba(89,193,255,0.10), transparent 60%),
        radial-gradient(900px 260px at 85% 30%, rgba(124,255,178,0.07), transparent 60%);
      pointer-events:none;
      filter: blur(12px);
      opacity:0.9;
    }
    .section > *{ position:relative; }

    .section h2{
      margin:0 0 12px;
      font-size:16px;
      letter-spacing:-0.3px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:12px;
    }

    .card{
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      border-radius: var(--r1);
      padding:14px;
      display:flex;
      flex-direction: column;
      gap:10px;
      min-height: 176px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.28);
      backdrop-filter: blur(14px);
      transition: 170ms ease;
      position:relative;
      overflow:hidden;
    }

    .card::after{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(520px 260px at 20% 25%, rgba(89,193,255,0.10), transparent 60%),
        radial-gradient(520px 260px at 80% 35%, rgba(124,255,178,0.07), transparent 60%);
      opacity:0;
      transition:170ms ease;
      pointer-events:none;
      filter: blur(12px);
    }

    .card:hover{
      border-color: rgba(89,193,255,0.20);
      box-shadow: 0 20px 55px rgba(0,0,0,0.38);
      transform: translateY(-2px);
    }
    .card:hover::after{ opacity:1; }

    .card h3{
      margin:0;
      font-size:14px;
      letter-spacing:-0.2px;
    }
    .card p{
      margin:0;
      color: var(--muted);
      font-size:13px;
      line-height:1.65;
      flex:1;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    .pill{
      font-size:11px;
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      padding:6px 10px;
      border-radius:999px;
      font-weight: 900;
      color: rgba(255,255,255,0.90);
    }

    .pill.cyan{
      border-color: rgba(89,193,255,0.28);
      background: rgba(89,193,255,0.10);
    }
    .pill.green{
      border-color: rgba(124,255,178,0.22);
      background: rgba(124,255,178,0.08);
    }

    .links{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .links a,
    .links .linkDisabled{
      font-size:12px;
      padding:8px 12px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      font-weight: 900;
      transition: 160ms ease;
      color: rgba(255,255,255,0.94);
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .links a:hover{
      background: rgba(89,193,255,0.10);
      border-color: rgba(89,193,255,0.24);
      transform: translateY(-1px);
    }

    /* Disabled link style for projects not yet published */
    .links .linkDisabled{
      opacity: 0.55;
      cursor: not-allowed;
      user-select: none;
    }

    .footer{
      margin-top: 18px;
      text-align:center;
      font-size: 12px;
      color: rgba(255,255,255,0.62);
    }

    @media (max-width: 920px){
      .hero{ grid-template-columns: 1fr; }
      nav{ justify-content:flex-start; }
      .grid{ grid-template-columns: 1fr; }
      h1{ font-size: 34px; }
      .topbar{ position: relative; top: 0; }
    }

    @media (prefers-reduced-motion: reduce){
      #bg{ display:none; }
      .card, .btn, .navlink{ transition:none; }
      .card:hover, .btn:hover, .navlink:hover{ transform:none; }
    }
  </style>
</head>

<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <img src="images/profile.jpg" alt="Sai Kandagattla profile photo" class="avatar" />
        <div>
          <strong>Sai Kandagattla</strong>
          <span>Cork, Ireland</span>
        </div>
      </div>
