<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sai Kandagattla | Portfolio</title>
  <meta name="description" content="Portfolio of Sai Kandagattla. Analytics projects in Python, SQL, Tableau, Power BI and Excel." />

  <style>
    :root{
      --bg: #0b1220;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --soft: rgba(255,255,255,0.12);
      --brand: #8bd3ff;
      --brand2: #a7f3d0;
      --warn: #fbbf24;
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
      --radius: 18px;
      --radius2: 26px;
      --max: 1080px;
    }

    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 600px at 20% 10%, rgba(139,211,255,0.22), transparent 60%),
                  radial-gradient(1000px 700px at 90% 20%, rgba(167,243,208,0.16), transparent 55%),
                  radial-gradient(900px 700px at 55% 95%, rgba(251,191,36,0.10), transparent 60%),
                  var(--bg);
    }

    a{ color: inherit; text-decoration: none; }
    a:hover{ text-decoration: underline; }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 28px 18px 56px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 10px 12px;
      border: 1px solid var(--soft);
      background: rgba(0,0,0,0.18);
      border-radius: 14px;
      backdrop-filter: blur(10px);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 220px;
    }

    .avatar{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(139,211,255,0.9), rgba(167,243,208,0.9));
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
    }

    .brand strong{ display:block; font-size: 14px; letter-spacing: 0.2px; }
    .brand span{ display:block; font-size: 12px; color: var(--muted); margin-top: 2px; }

    nav{
      display:flex;
      align-items:center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .navlink{
      font-size: 13px;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
    }
    .navlink:hover{
      color: var(--text);
      border-color: var(--soft);
      text-decoration: none;
      background: rgba(255,255,255,0.04);
    }

    .hero{
      margin-top: 22px;
      display:grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 16px;
    }

    .panel{
      border: 1px solid var(--soft);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.04));
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .panel:before{
      content:"";
      position:absolute;
      inset: -2px;
      background: radial-gradient(600px 240px at 20% 10%, rgba(139,211,255,0.22), transparent 55%),
                  radial-gradient(520px 240px at 85% 20%, rgba(167,243,208,0.14), transparent 55%);
      pointer-events:none;
      opacity: 0.9;
    }

    .panel > * { position: relative; }

    .kicker{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .dot{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--brand2);
      box-shadow: 0 0 0 6px rgba(167,243,208,0.10);
    }

    h1{
      margin: 12px 0 10px;
      font-size: 40px;
      line-height: 1.1;
      letter-spacing: -0.8px;
    }

    .sub{
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      max-width: 58ch;
    }

    .chips{
      margin-top: 16px;
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip{
      font-size: 12px;
      color: rgba(255,255,255,0.84);
      border: 1px solid var(--soft);
      background: rgba(255,255,255,0.03);
      padding: 8px 10px;
      border-radius: 999px;
    }

    .cta{
      margin-top: 18px;
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid var(--soft);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
    }

    .btn:hover{
      background: rgba(255,255,255,0.07);
      text-decoration:none;
    }

    .btn.primary{
      border-color: rgba(139,211,255,0.35);
      background: linear-gradient(135deg, rgba(139,211,255,0.20), rgba(167,243,208,0.14));
    }

    .right{
      display:grid;
      gap: 16px;
    }

    .mini{
      border: 1px solid var(--soft);
      background: rgba(255,255,255,0.04);
      border-radius: var(--radius);
      padding: 16px;
    }

    .mini h3{
      margin: 0 0 10px;
      font-size: 14px;
      letter-spacing: -0.2px;
    }

    .mini p{
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .list{
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display:grid;
      gap: 10px;
    }

    .li{
      display:flex;
      align-items:flex-start;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: rgba(0,0,0,0.12);
    }

    .li:hover{
      border-color: var(--soft);
      background: rgba(255,255,255,0.04);
    }

    .badge{
      font-size: 11px;
      padding: 6px 9px;
      border-radius: 999px;
      border: 1px solid var(--soft);
      color: rgba(255,255,255,0.82);
      background: rgba(255,255,255,0.03);
      white-space: nowrap;
    }

    .li strong{
      display:block;
      font-size: 13px;
      margin-bottom: 2px;
    }
    .li span{
      display:block;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .section{
      margin-top: 18px;
      border: 1px solid var(--soft);
      background: rgba(255,255,255,0.03);
      border-radius: var(--radius2);
      padding: 18px;
    }

    .section h2{
      margin: 0 0 12px;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card{
      border: 1px solid var(--soft);
      background: rgba(0,0,0,0.10);
      border-radius: var(--radius);
      padding: 14px;
      display:flex;
      flex-direction: column;
      gap: 10px;
      min-height: 160px;
    }

    .card h3{
      margin: 0;
      font-size: 14px;
      letter-spacing: -0.2px;
    }

    .card p{
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      flex: 1;
    }

    .meta{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items:center;
    }

    .pill{
      font-size: 11px;
      padding: 6px 9px;
      border-radius: 999px;
      border: 1px solid var(--soft);
      color: rgba(255,255,255,0.82);
      background: rgba(255,255,255,0.02);
    }

    .links{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .links a{
      font-size: 12px;
      color: rgba(255,255,255,0.86);
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--soft);
      background: rgba(255,255,255,0.03);
      text-decoration:none;
    }
    .links a:hover{
      background: rgba(255,255,255,0.06);
    }

    .footer{
      margin-top: 18px;
      color: var(--muted);
      text-align:center;
      font-size: 12px;
    }

    @media (max-width: 900px){
      .hero{ grid-template-columns: 1fr; }
      nav{ justify-content: flex-start; }
      .g
